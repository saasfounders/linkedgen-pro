services:
  - type: web
    name: linkedgen-backend
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: linkedgen-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

databases:
  - name: linkedgen-postgres
    databaseName: linkedgen_pro
    user: linkedgen_user
    plan: free
