services:
  - type: web
    name: linkedgen-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: linkedgen-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://saas-deployment-app-5vor3r1d.devinapps.com

databases:
  - name: linkedgen-postgres
    databaseName: linkedgen_pro
    user: linkedgen_user
    plan: free
